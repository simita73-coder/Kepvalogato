<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Képválogató</title>
<style>
  :root { --bg:#161616; --fg:#eee; --bt:#2c2c2c; --acc:#3d8bfd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; touch-action:manipulation; }
  body { display:flex; flex-direction:column; height:100dvh; }
  button { background:var(--bt); color:var(--fg); border:1px solid #444; border-radius:10px; padding:12px 8px; font-size:16px; }
  button:active { background:#444; }
  button.acc { background:var(--acc); border-color:var(--acc); }
  #setup { padding:14px; overflow:auto; flex:1; }
  #setup h2 { margin:.2em 0 .6em; }
  textarea { width:100%; height:180px; background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px; font-size:16px; }
  .row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
  .row > * { flex:1; }
  small { color:#aaa; }
  #work { display:none; flex-direction:column; flex:1; min-height:0; }
  #bar { display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:14px; }
  #bar #name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#bbb; }
  #stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #stage img { max-width:100%; max-height:100%; object-fit:contain; }
  /* Mappagombok: a kép megérintésére jönnek elő, jobb oldalt oszlopban */
  #cats { position:absolute; top:8px; right:8px; bottom:8px; display:none; direction:rtl;
          grid-auto-flow:column; grid-auto-columns:max-content; gap:6px; align-content:start; z-index:5;
          max-width:calc(100% - 16px); }
  #cats.open { display:grid; }
  #cats button { direction:ltr; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                 max-width:60vw; padding:12px 16px; font-size:17px; background:rgba(34,34,34,.93); border-color:#666; }
  #acts { display:flex; gap:6px; padding:6px 6px 8px; }
  #acts button { flex:1; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:20px; display:none; z-index:9; }
</style>
</head>
<body>

<div id="setup">
  <h2>Képválogató</h2>
  <div class="row"><button class="acc" id="pick">📷 Képek kiválasztása</button></div>
  <input type="file" id="files"
         accept="image/*,.jpg,.jpeg,.jfif,.pjpeg,.pjp,.png,.webp,.gif,.bmp,.avif"
         multiple hidden>
  <div id="loaded"><small>Még nincs kép betöltve.</small></div>

  <h3>Kategóriák</h3>
  <small>Soronként egy mappanév. A telefon mentve tartja, legközelebb is megvan.</small>
  <textarea id="catText" placeholder="pl.&#10;Tájkép&#10;Család&#10;Étel"></textarea>
  <div class="row">
    <button id="importCats">Kategóriák betöltése txt-ből</button>
    <input type="file" id="catFile" accept=".txt,text/plain" hidden>
  </div>

  <div class="row"><button class="acc" id="start">▶ Indítás</button></div>
  <div class="row">
    <button id="dl">⬇ Eredmény mentése (txt)</button>
    <button id="cp">📋 Másolás</button>
  </div>
  <div class="row"><button id="reset">Eddigi besorolások törlése</button></div>
  <small id="stat"></small>
</div>

<div id="work">
  <div id="bar">
    <button id="back">☰</button>
    <span id="name"></span>
    <span id="cnt"></span>
  </div>
  <div id="stage">
    <img id="img" alt="">
    <div id="cats"></div>
  </div>
  <div id="acts">
    <button id="skip">Kihagy</button>
    <button id="undo">↩ Vissza</button>
    <button id="done">Kész / Mentés</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const LS_CATS = 'kv_cats', LS_ASSIGN = 'kv_assign';
const IMG_EXT = /\.(jpe?g|jfif|pjpe?g|pjp|png|webp|gif|bmp|avif|heic|heif)$/i;
let files = [];            // File[] sorted
let idx = 0;               // current index
let cats = [];
let assign = {};           // filename -> category
let history = [];          // [{name, idx}] for undo
let curUrl = null;

const natural = (a, b) => a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'});
const isImage = f => (f.type && f.type.startsWith('image/')) || IMG_EXT.test(f.name);

function load() {
  try { assign = JSON.parse(localStorage.getItem(LS_ASSIGN) || '{}'); } catch { assign = {}; }
  $('catText').value = localStorage.getItem(LS_CATS) || '';
  updateStat();
}
function saveAssign() { try { localStorage.setItem(LS_ASSIGN, JSON.stringify(assign)); } catch {} }
function parseCats() {
  cats = $('catText').value.split('\n').map(s => s.trim()).filter(Boolean);
  try { localStorage.setItem(LS_CATS, cats.join('\n')); } catch {}
}
function toast(t, ms=1500) { const el = $('toast'); el.textContent = t; el.style.display='block'; clearTimeout(toast.t); toast.t = setTimeout(()=>el.style.display='none', ms); }
function updateStat() { $('stat').textContent = `Eddig besorolva: ${Object.keys(assign).length} kép`; }

$('pick').onclick = () => $('files').click();
$('files').onchange = e => {
  const all = [...e.target.files];
  files = all.filter(isImage).sort(natural);
  const skipped = all.filter(f => !isImage(f));
  const done = files.filter(f => assign[f.name]).length;
  let html = `<small>${files.length} kép betöltve, ebből ${done} már besorolva (ezeket átugorja).</small>`;
  if (skipped.length) {
    const names = skipped.slice(0, 5).map(f => f.name).join(', ');
    html += `<br><small>⚠ ${skipped.length} fájl kihagyva (nem kép): ${names}${skipped.length > 5 ? ' …' : ''}</small>`;
  }
  $('loaded').innerHTML = html;
};
$('importCats').onclick = () => $('catFile').click();
$('catFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('catText').value = (await f.text()).replace(/\r/g,'');
  parseCats(); toast('Kategóriák betöltve');
};

$('start').onclick = () => {
  parseCats();
  if (!files.length) return alert('Előbb válassz képeket.');
  if (!cats.length) return alert('Adj meg legalább egy kategóriát.');
  const box = $('cats');
  box.innerHTML = ''; box.classList.remove('open');
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = ev => { ev.stopPropagation(); choose(c); };
    box.appendChild(b);
  });
  history = []; idx = -1;
  $('setup').style.display = 'none'; $('work').style.display = 'flex';
  next();
  toast('Érintsd meg a képet a mappákhoz', 2500);
};

// ---- mappagombok megjelenítése / elrejtése ----
function openCats() {
  const box = $('cats');
  box.classList.add('open');
  const first = box.firstElementChild; if (!first) return;
  const bh = first.offsetHeight + 6;
  const rows = Math.max(1, Math.floor(($('stage').clientHeight - 16 + 6) / bh));
  box.style.gridTemplateRows = `repeat(${rows}, auto)`;
}
function closeCats() { $('cats').classList.remove('open'); }
$('stage').addEventListener('click', e => {
  if (e.target.closest('#cats')) return;
  if (idx >= files.length) return;
  $('cats').classList.contains('open') ? closeCats() : openCats();
});

function show(i) {
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(files[i]);
  const img = $('img');
  img.onerror = () => toast('Nem jeleníthető meg: ' + files[i].name, 2500);
  img.src = curUrl;
  $('name').textContent = files[i].name;
  $('cnt').textContent = `${i+1}/${files.length}`;
}
function next() {
  closeCats();
  idx++;
  while (idx < files.length && assign[files[idx].name]) idx++;
  if (idx >= files.length) {
    $('img').removeAttribute('src'); $('name').textContent = 'Nincs több kép 🎉'; $('cnt').textContent = `${files.length}/${files.length}`;
    return;
  }
  show(idx);
}
function choose(cat) {
  if (idx >= files.length) return;
  const name = files[idx].name;
  history.push({name, idx});
  assign[name] = cat; saveAssign(); updateStat();
  toast(`→ ${cat}`);
  next();
}
$('skip').onclick = next;
$('undo').onclick = () => {
  const h = history.pop(); if (!h) return;
  closeCats();
  delete assign[h.name]; saveAssign(); updateStat();
  idx = h.idx; show(idx); toast('Visszavonva');
};
$('back').onclick = $('done').onclick = () => {
  closeCats();
  $('work').style.display = 'none'; $('setup').style.display = 'block';
  const done = files.filter(f => assign[f.name]).length;
  $('loaded').innerHTML = `<small>${files.length} kép betöltve, ebből ${done} besorolva.</small>`;
};

// Billentyűk (asztali böngészőhöz): 1..9, 0 = kategóriák sorrendben
document.addEventListener('keydown', e => {
  if ($('work').style.display !== 'flex') return;
  if (e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'Backspace') $('undo').click();
  else if (/^[0-9]$/.test(e.key)) { const n = e.key === '0' ? 9 : +e.key - 1; if (cats[n]) choose(cats[n]); }
});

function resultText() {
  return Object.entries(assign).map(([n, c]) => `${n}\t${c}`).join('\n') + '\n';
}
$('dl').onclick = () => {
  if (!Object.keys(assign).length) return alert('Még nincs besorolt kép.');
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const fn = `valogatas_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.txt`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([resultText()], {type:'text/plain;charset=utf-8'}));
  a.download = fn; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('cp').onclick = async () => {
  try { await navigator.clipboard.writeText(resultText()); toast('Vágólapra másolva'); }
  catch { toast('Másolás nem sikerült'); }
};
$('reset').onclick = () => {
  if (confirm('Biztosan törlöd az összes eddigi besorolást?')) { assign = {}; saveAssign(); updateStat(); }
};
load();
</script>
</body>
</html>
